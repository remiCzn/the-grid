<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Grid</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="brand">
          <span class="logo">THE GRID</span>
          <span class="version-tag">v0.1.0</span>
        </div>

        <div class="controls">
          <button id="btn-power">Audio OFF</button>
          <button id="btn-save" title="Export patch JSON">Save</button>
          <button id="btn-load" title="Import patch JSON">Load</button>
          <input type="file" id="file-input" accept=".json,.grid" style="display: none" />
          <label class="param-slider">
            <span>Master</span>
            <input type="range" id="master-gain" min="0" max="1" step="0.01" value="0.8" />
            <span id="gain-label">80%</span>
          </label>

          <!-- Vu-Mètre Stéréo Décimé -->
          <div class="meter-container" title="Output Peak & RMS Meter">
            <div class="meter-channel">
              <span class="meter-label">L</span>
              <div class="meter-track">
                <div class="meter-bar" id="meter-bar-l"></div>
              </div>
            </div>
            <div class="meter-channel">
              <span class="meter-label">R</span>
              <div class="meter-track">
                <div class="meter-bar" id="meter-bar-r"></div>
              </div>
            </div>
            <div class="meter-numeric" id="meter-numeric">-inf dB</div>
          </div>
        </div>
      </header>

      <main class="grid-container">
        <canvas id="grid-canvas"></canvas>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
